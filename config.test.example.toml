# 测试专用配置模板：避开真实 NapCat/QQ 常用的 3001 端口
whitelist = ["123456789"]

[napcat]
ws_url = "ws://127.0.0.1:3002"
# 测试服务不需要鉴权时保持为空；不要提交真实 token
access_token = ""

[projects]
playground = ".\\playground"

[bridge]
default_project = "playground"
default_model = "gpt-5.6-luna"
approval_timeout_sec = 60
codex_path = "codex"
extra_writable_roots = []

[webui]
enabled = true
host = "127.0.0.1"
port = 8765
